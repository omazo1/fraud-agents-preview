[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-agents"
version = "0.1.0"
description = "Event-driven multi-agent AI fraud detection system (capstone project)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14,<3",
    "pandas>=3.1,<4",
    "scikit-learn>=1.9,<2",
    "xgboost>=3.4,<4",
    "shap>=0.54,<1",
    "redis>=8.1,<9",
    "fastapi>=0.159,<1",
    "uvicorn>=0.54,<1",
    "httpx>=0.28,<1",
    "streamlit>=1.66,<2",
    "psycopg[binary]>=3.3,<4",
    "langchain>=1.4,<2",
    "langchain-ollama>=1.1,<2",
    "langchain-anthropic>=1.7,<2",
    "langgraph>=1.2,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
