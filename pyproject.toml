[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-agents"
version = "0.1.0"
description = "Event-driven multi-agent AI fraud detection system (capstone project)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.14,<3"]

[tool.setuptools.packages.find]
where = ["src"]
